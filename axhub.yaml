version: axhub/v1
name: cluemap
metadata:
  name: "ClueMap · 현업 기준 추출 & 서류 빈칸 연결 보드"
runtime:
  port: 8080
  health_path: /healthz
build:
  framework: fastapi
  deploy_method: docker
  install: pip install -r requirements.txt
  start: python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}
