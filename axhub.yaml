version: axhub/v1
name: rebate-lens
metadata:
  name: "Rebate Lens · 판매장려금 검토"
runtime:
  port: 8080
  health_path: /healthz
build:
  framework: fastapi
  deploy_method: docker
  install: pip install -r requirements.txt
  start: python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}
database:
  engine: postgres
